name: README.md gh-pages sync
concurrency:
  group: readme-gh-pages-sync
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - README.md

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: gh-pages

      - name: Sync README.md to gh-pages
        run: |
          git config user.name "Kong's Team k8s bot"
          git config user.email "team-k8s+github-bot@konghq.com"
          git checkout main -- README.md
          git commit -m "chore: sync README.md from main branch" || echo "No changes to commit"
          git push origin gh-pages
