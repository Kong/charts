            == ''True'') || oldSelf.spec.aiGatewayRef == self.spec.aiGatewayRef'
        - fieldPath: .spec.apiSpec.type
          message: type is immutable
          rule: '!has(oldSelf.spec) || !has(oldSelf.spec.apiSpec) || !has(oldSelf.spec.apiSpec.type)
            || (has(self.spec) && has(self.spec.apiSpec) && has(self.spec.apiSpec.type)
            && self.spec.apiSpec.type == oldSelf.spec.apiSpec.type)'
    served: true
    storage: true
    subresources:
      status: {}

{{- end }}
