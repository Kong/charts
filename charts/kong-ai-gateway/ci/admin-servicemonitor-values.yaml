# Exercise the optional Admin API Service and ServiceMonitor rendering.
admin:
  enabled: true

serviceMonitor:
  enabled: true
  trustCRDsExist: true

# NOTE: The purpose of those values below is to:
# - to speed up the test
# - to prevent anonymous reports from being sent
readinessProbe:
  initialDelaySeconds: 1
  periodSeconds: 1

env:
  anonymous_reports: "off"
