# CI test for combined ingress hostname and hosts configuration where
# different hosts share the same path
proxy:
  ingress:
    enabled: true
    hostname: "proxy.kong.example"
    path: /
    hosts:
    - host: "proxy2.kong.example"
      paths:
        - path: /
          pathType: ImplementationSpecific

# NOTE: The purpose of those values below is to:
# - to speed up, the test
# - to prevent anonymous reports from being sent
readinessProbe:
  initialDelaySeconds: 1
  periodSeconds: 1

env:
  anonymous_reports: "off"

ingressController:
  env:
    anonymous_reports: "false"
